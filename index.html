
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universe Atlas | Explore Beyond</title>
<style>
:root{--bg:#050713;--panel:#10162b;--line:#283455;--cyan:#73e8ff;--purple:#a78bfa;--text:#eef4ff;--muted:#9ba9c7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 20% 10%,#22205a77,transparent 40%),radial-gradient(ellipse at 85% 65%,#073d5870,transparent 40%),#050713}
button,input,select{font:inherit}
button{cursor:pointer;color:var(--text);border:1px solid var(--line);background:#141b32;padding:10px 15px;border-radius:10px;transition:.2s}
button:hover{border-color:var(--cyan);transform:translateY(-1px);background:#202c49}
.primary{background:linear-gradient(120deg,#176d91,#6250bb);border:0}
header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #ffffff16;background:#080c1de8;position:sticky;top:0;z-index:10;backdrop-filter:blur(16px)}
.logo{font-size:20px;font-weight:900;letter-spacing:2px}.logo span{color:var(--cyan)}
nav{display:flex;gap:7px;flex-wrap:wrap}
nav button{font-size:12px;padding:9px 11px}
main{max-width:1450px;margin:auto;padding:28px 4% 60px}
.page{display:none;animation:appear .35s ease}.page.active{display:block}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{min-height:350px;display:flex;align-items:center;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;padding:clamp(25px,6vw,75px);background:radial-gradient(ellipse at 75% 50%,#393a8b77,transparent 35%),linear-gradient(120deg,#111a36,#080b19)}
.hero h1{font-size:clamp(38px,7vw,76px);line-height:1.03;margin:15px 0;letter-spacing:-2px;max-width:730px}
.hero p{color:var(--muted);font-size:17px;line-height:1.7;max-width:590px}
.kicker{color:var(--cyan);letter-spacing:3px;font-size:11px;font-weight:800}
.hero-orb{position:absolute;width:190px;height:190px;right:9%;top:22%;border-radius:50%;background:radial-gradient(circle at 30% 25%,#b2f8ff,#3b86c6 25%,#282568 60%,#080b19 75%);box-shadow:0 0 60px #4c9aff66, inset -25px -15px 35px #030513}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:35px 0 16px}
h2{font-size:25px;margin:0}h3{margin:8px 0}
.muted{color:var(--muted);line-height:1.6}
